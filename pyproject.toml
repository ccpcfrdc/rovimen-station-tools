[project]
name = "rms-meteors"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.2.0",
    "cryptography>=44.0.0",
    "ephem>=4.2",
    "flask>=3.1.3",
    "gitpython>=3.1.46",
    "imageio>=2.37.2",
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "paho-mqtt>=2.1.0",
    "paramiko>=4.0.0",
    "pillow>=12.0.0",
    "pydantic>=2.12.5",
    "pyephem>=9.99",
    "pyjwt[crypto]>=2.10.0",
    "flask-limiter>=3.5.0",
    "flask-wtf>=1.2.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
    "pyqtgraph>=0.12,<0.13",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "setuptools>=82.0.0",
    "shapely>=2.1",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
    "fakeredis>=2.36.2",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["rovimen-scripts", "dashboard", "tools"]
timeout = 60
